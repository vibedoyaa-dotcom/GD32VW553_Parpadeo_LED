transport select jtag
adapter speed 100
reset_config none

# TAPs
jtag newtap gd32vw553 cpu -irlen 5 -expected-id 0x10307a6d
jtag newtap gd32vw553 sys -irlen 5 -expected-id 0x790007a3

# Target RISC-V
target create gd32vw553.cpu riscv -chain-position gd32vw553.cpu
gd32vw553.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0

# (La línea 'flash bank ...' se elimina para evitar que busque el driver de STM32)